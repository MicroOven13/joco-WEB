			<section class="hero">
				<div class="container pad">
					<h1>Kapcsolat</h1>
					<p>
						Elérhetőség: <strong>feherj@grantis.hu</strong> •
						<strong>+36 30 634 0195</strong>
					</p>
					<form
						class="mt-16"
						action="https://formspree.io/f/mzzkygya"
						method="POST"
					>
						<div>
							<label>Név*</label>
							<input required name="name" placeholder="" />
						</div>

						<div>
							<label>E-mail*</label>
							<input required type="email" name="email" placeholder="" />
						</div>

						<div>
							<label>Telefonszám*</label>
							<input
								id="phone"
								name="phone"
								type="tel"
								inputmode="numeric"
								autocomplete="tel"
								required
								maxlength="15"
								pattern="^[0-9]{9,15}$"
								title="Kérlek, csak számokat adj meg (9–15 számjegy)."
								oninput="this.value=this.value.replace(/[^0-9]/g,'');"
								placeholder=""
							/>
						</div>
						<div>
							<label>Irányítószám*</label>
							<input
								id="zip"
								name="zip"
								required
								inputmode="numeric"
								maxlength="4"
								pattern="^\d{4}$"
								title="Kérlek, 4 számjegyet adj meg (pl. 1051)."
								placeholder=""
								oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4);"
							/>
							<small
								id="zip-error"
								class="field-error"
								style="display: none; color: #b91c1c"
							>
								Kérlek, 4 számjegyet adj meg (pl. 1051).
							</small>
						</div>

						<div>
							<label>Miért jelentkezik? Mit szeretne?</label>
							<textarea name="message" rows="5" placeholder=""></textarea>
						</div>

						<div>
							<label>Preferált kapcsolatfelvétel</label>
							<select name="contact_pref">
								<option>E-mail</option>
								<option>Telefon</option>
							</select>
						</div>

						<label class="consent" id="gdpr-consent">
							<input
								type="checkbox"
								required
								name="gdpr"
								aria-describedby="gdpr-error"
							/>
							<span>
								Elolvastam és elfogadom az
								<a href="adatkezeles.html" target="_blank" rel="noopener"
									>Adatkezelési tájékoztatót</a
								>, és hozzájárulok, hogy a megadott személyes adataimat Fehér
								József a kapcsolatfelvétel és időpont-egyeztetés céljából
								kezelje.
							</span>
						</label>
						<p
							id="gdpr-error"
							style="
								display: none;
								color: #b91c1c;
								font-size: 13px;
								margin: 6px 0 10px 0;
							"
						>
							Kérlek, jelöld be a hozzájárulást a folytatáshoz.
						</p>

						<button class="submit" type="submit" id="submit-btn" disabled>
							Beküldés
						</button>

						<input
							type="hidden"
							name="_subject"
							value="Új érdeklődés – feherjozsef.hu"
						/>
						<input type="hidden" name="_redirect" value="/koszonjuk.html" />
						<input type="text" name="_gotcha" style="display: none" />
					</form>

					<p style="margin-top: 10px; font-size: 12px; color: #6b7280">

      <script>
    document.addEventListener('DOMContentLoaded', function(){
      const btn  = document.getElementById('menu-toggle');
      const menu = document.getElementById('mainmenu');
      if (!btn || !menu) return;

      btn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        const open = menu.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });

      document.addEventListener('click', function(e){
        if (menu.classList.contains('open') &&
            !menu.contains(e.target) && e.target !== btn) {
          menu.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });
    });
  </script>
